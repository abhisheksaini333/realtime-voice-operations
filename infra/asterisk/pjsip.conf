[global]
type=global
endpoint_identifier_order=username,ip

[voiceops-udp]
type=transport
protocol=udp
bind=0.0.0.0:18160
external_signaling_address=127.0.0.1
external_signaling_port=18160
external_media_address=127.0.0.1
local_net=172.16.0.0/12

[1001]
type=endpoint
transport=voiceops-udp
context=voiceops-local
disallow=all
allow=ulaw
direct_media=no
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1002]
type=endpoint
transport=voiceops-udp
context=voiceops-local
disallow=all
allow=ulaw
auth=operator-auth
aors=1002
direct_media=no
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[operator-auth]
type=auth
auth_type=userpass
username=1002
password=local-operator-pass

[1002]
type=aor
max_contacts=1
remove_existing=yes
